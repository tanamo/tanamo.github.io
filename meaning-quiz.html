<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meaning quiz</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }
      body {
        margin: 0 auto;
        max-width: 36rem;
        padding: 1.25rem;
      }
      h1 {
        font-size: 1.35rem;
        margin-top: 0;
      }
      .quiz-meta {
        color: #444;
        font-size: 0.95rem;
        margin-bottom: 1rem;
      }
      #meaning-loading {
        color: #555;
      }
      #meaning-error {
        background: #ffecec;
        border: 1px solid #e0a0a0;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        color: #8b0000;
      }
      #meaning-main[hidden],
      #meaning-loading[hidden],
      #meaning-error[hidden] {
        display: none;
      }
      #meaning-prompt {
        margin: 1rem 0;
        padding: 1rem 1.25rem 1.15rem;
        background: #f6f8fa;
        border-radius: 8px;
        text-align: center;
      }
      .meaning-prompt-lead {
        margin: 0 0 0.65rem;
        font-size: 1.05rem;
        color: #333;
      }
      .meaning-prompt-target {
        margin: 0;
        font-size: 2.2rem;
        font-weight: 600;
        line-height: 1.3;
      }
      .meaning-prompt-q {
        font-weight: 600;
        color: #333;
      }
      #meaning-word {
        font-size: 1.2em;
        font-weight: 600;
      }
      #meaning-word ruby {
        ruby-position: over;
      }
      #meaning-word rt {
        font-size: 0.45em;
        font-weight: 400;
      }
      .quiz-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      #meaning-answer {
        flex: 1;
        min-width: 12rem;
        padding: 0.45rem 0.55rem;
        font-size: 1.05rem;
      }
      @keyframes meaning-input-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-7px);
        }
        40% {
          transform: translateX(7px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      #meaning-answer.meaning-input-shake {
        animation: meaning-input-shake 0.42s ease;
      }
      button {
        padding: 0.45rem 0.9rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .quiz-feedback {
        margin-top: 0.75rem;
        min-height: 1.5em;
        font-size: 1rem;
      }
      .quiz-feedback.ok {
        color: #0d5316;
      }
      .quiz-feedback.bad {
        color: #b00020;
      }
      #meaning-gloss {
        margin-top: 0.6rem;
        padding: 0.6rem 0.75rem;
        background: #f3f8ff;
        border: 1px solid #cfe0ff;
        border-radius: 6px;
        font-size: 0.95rem;
        color: #1f3558;
      }
      #meaning-gloss[hidden] {
        display: none;
      }
      .quiz-panel {
        margin: 0 0 0.75rem;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #fff;
      }
      .quiz-panel > summary {
        padding: 0.65rem 0.85rem 0.65rem 2rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        list-style: none;
        position: relative;
        user-select: none;
      }
      .quiz-panel > summary::-webkit-details-marker {
        display: none;
      }
      .quiz-panel > summary::before {
        content: "";
        position: absolute;
        left: 0.75rem;
        top: 50%;
        width: 0.45rem;
        height: 0.45rem;
        border-right: 2px solid #555;
        border-bottom: 2px solid #555;
        transform: translateY(-65%) rotate(-45deg);
        transition: transform 0.15s ease;
      }
      .quiz-panel[open] > summary::before {
        transform: translateY(-35%) rotate(45deg);
      }
      .quiz-panel[open] > summary {
        border-bottom: 1px solid #e8ecf0;
      }
      .quiz-panel-body {
        padding: 0.65rem 1rem 1rem;
      }
      .meaning-jmdict-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        align-items: center;
      }
      .meaning-jmdict-grid label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.92rem;
        cursor: pointer;
      }
      .meaning-jmdict-grid input {
        width: 1.05rem;
        height: 1.05rem;
        cursor: pointer;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #666;
      }
      footer a {
        color: #0645ad;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meaning quiz</h1>
      <p class="quiz-meta">Score: <strong id="meaning-score">0 / 0</strong></p>

      <details class="quiz-panel" id="meaning-jmdict-fieldset">
        <summary>Dictionary (JLPT word lists)</summary>
        <div class="quiz-panel-body">
          <p style="margin: 0 0 0.5rem; font-size: 0.88rem; color: #555">
            Turn each list on or off. At least one must stay on.
          </p>
          <div class="meaning-jmdict-grid" role="group" aria-label="JMdict source files">
            <label
              ><input type="checkbox" id="meaning-jmdict-n5" data-jmdict="n5" checked />
              N5 </label
            >
            <label
              ><input type="checkbox" id="meaning-jmdict-n4" data-jmdict="n4" />
              N4 </label
            >
            <label
              ><input type="checkbox" id="meaning-jmdict-n3" data-jmdict="n3" />
              N3 </label
            >
            <label
              ><input type="checkbox" id="meaning-jmdict-n2" data-jmdict="n2" />
              N2 </label
            >
            <label
              ><input type="checkbox" id="meaning-jmdict-n1" data-jmdict="n1" />
              N1 </label
            >
          </div>
        </div>
      </details>

      <p id="meaning-loading">Loading dictionary…</p>
      <p id="meaning-error" hidden></p>

      <section id="meaning-main" hidden aria-live="polite">
        <div id="meaning-prompt" hidden>
          <p class="meaning-prompt-lead">What is the English meaning of</p>
          <p class="meaning-prompt-target">
            <span id="meaning-word" lang="ja"></span
            ><span class="meaning-prompt-q">?</span>
          </p>
        </div>
        <div class="quiz-row">
          <label for="meaning-answer" class="sr-only">Your answer</label>
          <input
            id="meaning-answer"
            type="text"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="none"
            placeholder="Type an English meaning..."
          />
          <button type="button" id="meaning-check">Check</button>
          <button type="button" id="meaning-next" hidden>Next</button>
        </div>
        <p id="meaning-feedback" class="quiz-feedback"></p>
        <div id="meaning-gloss" hidden></div>
      </section>
    </main>
    <footer>
      <a href="index.html">Verb conjugation quiz</a>
    </footer>
    <script src="meaning-quiz.js"></script>
  </body>
</html>
