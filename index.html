<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verb conjugation quiz</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }
      body {
        margin: 0 auto;
        max-width: 36rem;
        padding: 1.25rem;
      }
      h1 {
        font-size: 1.35rem;
        margin-top: 0;
      }
      .quiz-meta {
        color: #444;
        font-size: 0.95rem;
        margin-bottom: 1rem;
      }
      #quiz-loading {
        color: #555;
      }
      #quiz-error {
        background: #ffecec;
        border: 1px solid #e0a0a0;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        color: #8b0000;
      }
      #quiz-main[hidden],
      #quiz-loading[hidden],
      #quiz-error[hidden] {
        display: none;
      }
      #quiz-prompt {
        margin: 1rem 0;
        padding: 1rem 1.25rem 1.15rem;
        background: #f6f8fa;
        border-radius: 8px;
        text-align: center;
      }
      .quiz-prompt-lead {
        margin: 0 0 0.65rem;
        font-size: 1.05rem;
        color: #333;
      }
      #quiz-form-name {
        font-weight: 700;
        color: #1a1a1a;
      }
      .quiz-prompt-lemma {
        margin: 0;
        font-size: 2.2rem;
        font-weight: 600;
        line-height: 1.3;
      }
      .quiz-prompt-q {
        font-weight: 600;
        color: #333;
      }
      #quiz-lemma {
        font-size: 1.2em;
        font-weight: 600;
      }
      #quiz-lemma ruby {
        ruby-position: over;
      }
      #quiz-lemma rt {
        font-size: 0.45em;
        font-weight: 400;
        letter-spacing: normal;
      }
      .quiz-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      #quiz-answer {
        flex: 1;
        min-width: 10rem;
        padding: 0.45rem 0.55rem;
        font-size: 1.1rem;
      }
      @keyframes quiz-input-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-7px);
        }
        40% {
          transform: translateX(7px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      #quiz-answer.quiz-input-shake {
        animation: quiz-input-shake 0.42s ease;
      }
      button {
        padding: 0.45rem 0.9rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .quiz-feedback {
        margin-top: 0.75rem;
        min-height: 1.5em;
        font-size: 1rem;
      }
      .quiz-feedback.ok {
        color: #0d5316;
      }
      .quiz-feedback.bad {
        color: #b00020;
      }
      .quiz-verb-info {
        margin-top: 0.6rem;
        padding: 0.6rem 0.75rem;
        background: #f3f8ff;
        border: 1px solid #cfe0ff;
        border-radius: 6px;
        font-size: 0.95rem;
        color: #1f3558;
      }
      .quiz-verb-info[hidden] {
        display: none;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #666;
      }
      footer a {
        color: #0645ad;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .quiz-panel {
        margin: 0 0 0.75rem;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        background: #fff;
      }
      .quiz-panel > summary {
        padding: 0.65rem 0.85rem 0.65rem 2rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        list-style: none;
        position: relative;
        user-select: none;
      }
      .quiz-panel > summary::-webkit-details-marker {
        display: none;
      }
      .quiz-panel > summary::before {
        content: "";
        position: absolute;
        left: 0.75rem;
        top: 50%;
        width: 0.45rem;
        height: 0.45rem;
        border-right: 2px solid #555;
        border-bottom: 2px solid #555;
        transform: translateY(-65%) rotate(-45deg);
        transition: transform 0.15s ease;
      }
      .quiz-panel[open] > summary::before {
        transform: translateY(-35%) rotate(45deg);
      }
      .quiz-panel[open] > summary {
        border-bottom: 1px solid #e8ecf0;
      }
      .quiz-panel-body {
        padding: 0.65rem 1rem 1rem;
      }
      .quiz-panel-hint {
        margin: 0 0 0.5rem;
        font-size: 0.88rem;
        color: #555;
      }
      .quiz-form-fieldset {
        margin: 0;
        padding: 0;
        border: none;
      }
      .quiz-form-fieldset legend {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .quiz-form-actions {
        margin: 0 0 0.65rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }
      .quiz-form-action-btn {
        padding: 0.2rem 0.55rem;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .quiz-form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
        gap: 0.35rem 0.75rem;
        align-items: start;
      }
      .quiz-form-grid label {
        display: flex;
        align-items: flex-start;
        gap: 0.4rem;
        font-size: 0.88rem;
        line-height: 1.35;
        cursor: pointer;
      }
      .quiz-form-grid input {
        margin-top: 0.2rem;
        flex-shrink: 0;
      }
      .quiz-jmdict-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        align-items: center;
      }
      .quiz-jmdict-grid label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.92rem;
        cursor: pointer;
      }
      .quiz-jmdict-grid input {
        width: 1.05rem;
        height: 1.05rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Verb conjugation quiz</h1>
      <p class="quiz-meta">
        Score: <strong id="quiz-score">0 / 0</strong>
      </p>

      <details class="quiz-panel" id="quiz-jmdict-fieldset">
        <summary>Dictionary (JLPT word lists)</summary>
        <div class="quiz-panel-body">
          <p class="quiz-panel-hint">
            Turn each list on or off. At least one must stay on.
          </p>
          <div class="quiz-jmdict-grid" role="group" aria-label="JMdict source files">
            <label
              ><input type="checkbox" id="quiz-jmdict-n5" data-jmdict="n5" checked />
              N5 </label
            >
            <label
              ><input type="checkbox" id="quiz-jmdict-n4" data-jmdict="n4" />
              N4 </label
            >
            <label
              ><input type="checkbox" id="quiz-jmdict-n3" data-jmdict="n3" />
              N3 </label
            >
            <label
              ><input type="checkbox" id="quiz-jmdict-n2" data-jmdict="n2" />
              N2 </label
            >
            <label
              ><input type="checkbox" id="quiz-jmdict-n1" data-jmdict="n1" />
              N1 </label
            >
          </div>
        </div>
      </details>

      <p id="quiz-loading">Loading dictionary…</p>
      <p id="quiz-error" hidden></p>

      <section id="quiz-main" hidden aria-live="polite">
        <details class="quiz-panel" id="quiz-form-details">
          <summary>Which conjugations to practice</summary>
          <div class="quiz-panel-body">
            <fieldset id="quiz-form-fieldset" class="quiz-form-fieldset">
              <legend>Which conjugations to practice</legend>
              <p class="quiz-form-actions">
                <button type="button" id="quiz-forms-all" class="quiz-form-action-btn">
                  Enable all
                </button>
                <button type="button" id="quiz-forms-none" class="quiz-form-action-btn">
                  Disable all
                </button>
              </p>
              <div
                id="quiz-form-toggles"
                class="quiz-form-grid"
                role="group"
                aria-label="Toggle conjugation types"
              ></div>
            </fieldset>
          </div>
        </details>
        <div id="quiz-prompt" hidden>
          <p class="quiz-prompt-lead">
            What is the <strong id="quiz-form-name"></strong> of
          </p>
          <p class="quiz-prompt-lemma">
            <span id="quiz-lemma" lang="ja"></span
            ><span class="quiz-prompt-q">?</span>
          </p>
        </div>
        <div class="quiz-row">
          <label for="quiz-answer" class="sr-only">Your answer</label>
          <input
            id="quiz-answer"
            type="text"
            autocomplete="off"
            spellcheck="false"
            lang="ja"
            autocapitalize="none"
            placeholder="Type the conjugated form…"
          />
          <button type="button" id="quiz-check">Check</button>
          <button type="button" id="quiz-next" hidden>Next</button>
        </div>
        <p id="quiz-feedback" class="quiz-feedback"></p>
        <div id="quiz-verb-info" class="quiz-verb-info" hidden></div>
      </section>
    </main>
    <footer>
      <a href="meaning-quiz.html">Meaning quiz</a>
    </footer>
    <script src="script.js"></script>
    <script src="quiz.js"></script>
  </body>
</html>
